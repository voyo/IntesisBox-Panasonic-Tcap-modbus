# Panasonic IntesisBox Modbus Register Configuration
# This file defines the sensors and settings for the Modbus interface

sensors:
  - id: 1
    name: "outdoor_temp"
    register: 1
    functioncode: 3
    decimals: 0
    signed: true
    typename: "Temperature"
    description: "Outside temperature"

  - id: 2
    name: "outlet_water_temp"
    register: 2
    functioncode: 3
    decimals: 0
    signed: true
    typename: "Temperature"
    description: "Outlet temperature"

  - id: 3
    name: "inlet_temp"
    register: 3
    functioncode: 3
    decimals: 0
    signed: true
    typename: "Temperature"
    description: "Inlet temperature"

  - id: 4
    name: "tank_water_temp"
    register: 32
    functioncode: 3
    decimals: 0
    signed: true
    typename: "Temperature"
    description: "Tank water temperature"

  - id: 5
    name: "Tank energy consumption"
    register: 45
    functioncode: 3
    decimals: 0
    signed: false
    typename: "kWh"
    description: "Tank mode energy consumption"

  - id: 6
    name: "Heat energy consumption"
    register: 46
    functioncode: 3
    decimals: 0
    signed: false
    typename: "kWh"
    description: "Heat mode energy consumption"

  - id: 7
    name: "Cool energy consumption"
    register: 47
    functioncode: 3
    decimals: 0
    signed: false
    typename: "kWh"
    description: "Cool mode energy consumption"

  - id: 8
    name: "Tank Energy Generation"
    register: 187
    functioncode: 3
    decimals: 0
    signed: false
    typename: "kWh"
    description: "Tank mode energy consumption"

  - id: 9
    name: "Heat Energy Generation"
    register: 188
    functioncode: 3
    decimals: 0
    signed: false
    typename: "kWh"
    description: "Heat mode energy consumption"

  - id: 10
    name: "Cool Energy Generation"
    register: 189
    functioncode: 3
    decimals: 0
    signed: false
    typename: "kWh"
    description: "Cool mode energy consumption"

  - id: 11
    name: "Current error code"
    register: 52
    functioncode: 3
    decimals: 0
    signed: false
    typename: "Text"
    description: "Current error code with description"

  - id: 12
    name: "Connection Health"
    register: 0
    functioncode: 3
    decimals: 0
    signed: false
    typename: "Text"
    description: "Modbus connection health status"

  - id: 13
    name: "Current error status"
    register: 70
    functioncode: 3
    decimals: 0
    signed: false
    typename: "Alert"
    description: "Current error status (0=OK, 1=Error)"

  # Zone 1 sensors
  - id: 14
    name: "Zone 1 current temperature"
    register: 14
    functioncode: 3
    decimals: 0
    signed: true
    typename: "Temperature"
    description: "Zone 1 actual temperature (water/room/pool depending on sensor type)"

  - id: 15
    name: "Zone 1 sensor type"
    register: 10
    functioncode: 3
    decimals: 0
    signed: false
    typename: "Text"
    description: "Zone 1 sensor type: 1=Water, 2=Ext room, 3=Int room, 4=Thermistor, 5=Pool"

  - id: 16
    name: "Zone 1 temp setting mode"
    register: 16
    functioncode: 3
    decimals: 0
    signed: false
    typename: "Text"
    description: "Zone 1 temp mode: 1=Room, 2=Compensation curve, 3=Direct, 4=Pool"

  # COP (Coefficient of Performance) - calculated values
  - id: 17
    name: "Heat COP"
    register: 0
    functioncode: 3
    decimals: 2
    signed: false
    type: 243
    subtype: 31
    description: "Heat mode Coefficient of Performance (Energy Generated / Energy Consumed)"
    options:
      Custom: "1;COP"

  - id: 18
    name: "Cool COP"
    register: 0
    functioncode: 3
    decimals: 2
    signed: false
    type: 243
    subtype: 31
    description: "Cool mode Coefficient of Performance (Energy Generated / Energy Consumed)"
    options:
      Custom: "1;COP"

  - id: 19
    name: "Tank COP"
    register: 0
    functioncode: 3
    decimals: 2
    signed: false
    type: 243
    subtype: 31
    description: "Tank mode Coefficient of Performance (Energy Generated / Energy Consumed)"
    options:
      Custom: "1;COP"

  - id: 20
    name: "Overall COP"
    register: 0
    functioncode: 3
    decimals: 2
    signed: false
    type: 243
    subtype: 31
    description: "Overall system Coefficient of Performance"
    options:
      Custom: "1;COP"

  # Defrost Cycle Monitoring
  - id: 21
    name: "Defrost Status"
    register: 0
    functioncode: 3
    decimals: 0
    signed: false
    typename: "Text"
    description: "Current defrost status (calculated: heat consumption > 0 AND heat generation = 0)"

  - id: 22
    name: "Defrost Cycle Count"
    register: 0
    functioncode: 3
    decimals: 0
    signed: false
    type: 243
    subtype: 31
    description: "Total number of defrost cycles since installation"
    options:
      Custom: "1;cycles"

  - id: 23
    name: "Defrost Statistics"
    register: 0
    functioncode: 3
    decimals: 0
    signed: false
    typename: "Text"
    description: "Defrost cycle statistics: total cycles, last duration, average duration, total time"

settings:
  - id: 51
    name: "System On/Off"
    register: 0
    functioncode: 3
    type: 244
    subtype: 73
    switchtype: 0

  - id: 52
    name: "OperatingMode"
    register: 4
    functioncode: 3
    type: 244
    subtype: 0
    switchtype: 18
    options:
      LevelActions: "|act1| |act2|"
      LevelNames: "|Heat|Heat Tank|Tank|Cool Tank|Cool|Auto|Auto Tank|Auto Heat|Auto Heat Tank|Auto Cool|Auto Cool Tank"
      LevelOffHidden: "true"
      SelectorStyle: "1"

  - id: 53
    name: "Heat temp method"
    register: 5
    functioncode: 3
    description: "Heat mode temperature setting method: Compensation Curve (auto based on outdoor temp) or Direct (manual setpoint)"
    type: 244
    subtype: 62
    switchtype: 18
    options:
      LevelActions: "|||"
      LevelNames: "|Compensation Curve|Direct"
      LevelOffHidden: "true"
      SelectorStyle: "1"

  - id: 54
    name: "Cool temp method"
    register: 6
    functioncode: 3
    description: "Cool mode temperature setting method: Compensation Curve (auto based on outdoor temp) or Direct (manual setpoint)"
    type: 244
    subtype: 62
    switchtype: 18
    options:
      LevelActions: "|||"
      LevelNames: "|Compensation Curve|Direct"
      LevelOffHidden: "true"
      SelectorStyle: "1"

  - id: 55
    name: "Tank set temp"
    register: 33
    functioncode: 3
    description: "Tank water setpoint temperature (40-75°C). Tank must be ON (register 30) to allow changes."
    type: 242
    subtype: 1

  - id: 56
    name: "Valve direction"
    register: 85
    functioncode: 3
    description: "Valve direction (read-only): Tank or Room"
    type: 244
    subtype: 62
    switchtype: 18
    options:
      LevelActions: "|||"
      LevelNames: "|Tank|Room"
      LevelOffHidden: "true"
      SelectorStyle: "1"

  - id: 57
    name: "Zone 1 setpoint temperature"
    register: 12
    functioncode: 3
    decimals: 0
    description: "Zone 1 setpoint temperature (set point/heating curve offset). Range depends on mode: Water shift -5..5°C, Water 5..65°C, Room 10..30°C, Pool 15..35°C"
    type: 242
    subtype: 1
